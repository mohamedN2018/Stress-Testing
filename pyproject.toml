[project]
name = "sentinel-test-lab"
version = "1.0.0"
description = "Authorized website load, resilience and defensive security testing desktop application"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PySide6-Essentials>=6.7,<6.11",
    "pyqtgraph>=0.13.7",
    "httpx[http2]>=0.27",
    "psutil>=5.9",
    "dnspython>=2.6",
    "cryptography>=42",
    "Jinja2>=3.1",
    "structlog>=24.1",
    "keyring>=25",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "aiohttp>=3.9",
    "pyinstaller>=6.6",
]
locust = ["locust>=2.29"]

[project.scripts]
sentinel-test-lab = "sentinel_test_lab.app.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_test_lab*"]

[tool.setuptools.package-data]
sentinel_test_lab = ["ui/themes/*.qss", "ui/themes/app.ico", "ui/themes/app.png","reporting/templates/*", "database/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that run against the bundled local test server",
    "locust: tests that require the optional locust package",
    "k6: tests that require the k6 binary",
    "zap: tests that require an OWASP ZAP installation (slow: starts the daemon)",
]
